name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # jsdom 30 requires ^22.22.2 || ^24.15.0 || >=26. On Node 20 undici's
      # webidl shim finds no worker_threads.markAsUncloneable and every vitest
      # worker dies before a single test runs.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

      - run: npm run test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Builds and previews over plain HTTP; the default Vite config needs TLS
      # certificates that are deliberately not in the repo.
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
